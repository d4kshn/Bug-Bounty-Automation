version: 1
id: secret-exposure
title: Public secret-candidate triage
tags: [secret_candidate, gitleaks, repository, secret, exposure]
reasoning:
  - Distinguish examples, test fixtures, revoked values, and real credential formats.
  - Establish public reachability and ownership before assessing impact.
  - Never infer validity from pattern matching alone.
safe_checks:
  - Review repository history and surrounding code without copying the full value.
  - Ask a human to validate through a non-destructive provider-specific method if policy permits.
stop_conditions:
  - Validation would authenticate, enumerate private data, spend money, or change state.
  - The credential appears to belong to a third party or employee personal account.
evidence_required:
  - Repository, commit, file, line, and rule identifier
  - Fully redacted candidate fingerprint
  - Human validation notes if validation is allowed
