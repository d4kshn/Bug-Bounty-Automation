apiVersion: 1
datasources:
  - name: Pipeline PostgreSQL
    uid: bbpipeline-postgres
    type: postgres
    access: proxy
    url: db:5432
    user: grafana_reader
    database: $POSTGRES_DB
    isDefault: true
    editable: false
    secureJsonData:
      password: $GRAFANA_READER_PASSWORD
    jsonData:
      database: $POSTGRES_DB
      sslmode: disable
      postgresVersion: 1700
      timescaledb: false
